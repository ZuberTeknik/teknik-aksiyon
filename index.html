  function closeMenu() { if (!$('#modal').hidden && $('.menu-sheet')) closeModal(); }

  document.addEventListener('click', async e => {
    const t = e.target;
    let el;
    if ((el = t.closest('a[data-route]'))) { e.preventDefault(); go(el.dataset.route); return; }
    if ((el = t.closest('[data-bn="menu"]'))) { e.preventDefault(); openMenu(); return; }
    if ((el = t.closest('[data-complete]'))) { e.stopPropagation(); el.disabled = true; const r = await quickComplete(el.dataset.complete); if (r === false) el.disabled = false; return; }
    if ((el = t.closest('[data-open]')) && !t.closest('input,button,label')) { openDrawer(el.dataset.open); return; }
    if ((el = t.closest('[data-close]'))) { closeDrawer(); return; }
    if (t.id === 'scrim') { closeDrawer(); return; }
    if ((el = t.closest('[data-dtab]'))) { if (ui.drawer.dirty && el.dataset.dtab !== 'detay' && !(await confirmDiscard())) return; ui.drawer.dirty = false; ui.drawer.tab = el.dataset.dtab; renderDrawer(); return; }
    if (t.closest('[data-dsave]')) { if (ui.drawer.tab !== 'detay') { ui.drawer.tab = 'detay'; renderDrawer(); return; } saveDrawer(); return; }
    if (t.closest('[data-dcomplete]')) {
      if (ui.drawer.tab === 'detay') { const note = await askClose(repo.actions.get(ui.drawer.id)); if (note !== null) saveDrawer(Object.assign({ durum: 'Tamamlandı' }, note ? { kapanisAciklamasi: note } : {})); }
      else { const a = repo.actions.get(ui.drawer.id); await quickComplete(a.aksiyonId); if (ui.drawer) { ui.drawer.base = repo.actions.get(a.aksiyonId).surum; renderDrawer(); } }
      return;
    }
    if (t.closest('[data-reopen]')) { saveDrawer({ durum: 'Açık', tamamlanmaTarihi: '' }); return; }
    if (t.closest('[data-del]')) {
      const d = ui.drawer, a = d && repo.actions.get(d.id); if (!a) return;
      const neden = await askReason('"' + a.aksiyonId + ' — ' + (a.konu || '').slice(0, 60) + '" silinsin mi?', 'Kayıt listelerden ve raporlardan kaldırılır; değişiklik geçmişiyle birlikte saklanır ve panel yöneticisi geri alabilir. Excel\'e aktarılmış satır Excel\'den ayrıca silinmelidir.');
      if (neden === null) return;
      try { await repo.deleteAction(a.aksiyonId, d.dirty ? null : d.base, neden); toast(a.aksiyonId + ' silindi.', 'ok'); closeDrawer(true); }
      catch (err) { toast(err.conflict ? err.message : 'Silinemedi: ' + (err.message || err.code), 'bad'); }
      return;
    }
    if ((el = t.closest('[data-restore]'))) {
      try { const n = await repo.restoreAction(el.dataset.restore); toast(n.aksiyonId + ' geri alındı.', 'ok'); if (ui.drawer) { ui.drawer.base = n.surum; renderDrawer(); } rerenderIf('ayarlar', renderAyarlar); }
      catch (err) { toast('Geri alınamadı: ' + (err.message || err.code), 'bad'); }
      return;
    }
    if ((el = t.closest('[data-sortk]'))) { const v = $('.toolbar').dataset.view, st = ui.lists[v]; const k = el.dataset.sortk; st.sort = { k, d: st.sort.k === k && st.sort.d === 'asc' ? 'desc' : 'asc' }; renderListResults(v); return; }
    if (t.closest('[data-ftoggle]')) { t.closest('.toolbar').classList.toggle('show-f'); return; }
    if ((el = t.closest('[data-page]'))) { const v = $('.toolbar').dataset.view; ui.lists[v].page = Number(el.dataset.page) || 1; renderListResults(v); $('.toolbar').scrollIntoView({ block: 'start' }); return; }
    if (t.closest('[data-clearf]')) { const v = $('.toolbar').dataset.view; ui.lists[v].f = {}; ui.lists[v].q = ''; ui.lists[v].page = 1; renderList($('#content'), v); return; }
    if (t.closest('[data-exportlist]')) { const v = $('.toolbar').dataset.view; exportRows(filterActions(v), 'Teknik_Aksiyonlar_' + v + '_' + m.todayStr() + '.xlsx'); return; }
    if ((el = t.closest('[data-kpi]'))) { const r = el.dataset.kpi; ui.lists[r].f = JSON.parse(el.dataset.f || '{}'); ui.lists[r].q = ''; ui.lists[r].page = 1; go(r); return; }
    if ((el = t.closest('[data-gofilter]'))) { ui.lists.liste.f = { [el.dataset.gofilter]: el.dataset.val }; ui.lists.liste.q = ''; ui.lists.liste.page = 1; go('liste'); return; }
    if (t.closest('[data-backup]')) { exportRows([...repo.actions.values()].sort((a, b) => String(a.aksiyonId).localeCompare(String(b.aksiyonId))), 'Teknik_Aksiyon_YEDEK_' + m.todayStr() + '.xlsx'); return; }
    if ((el = t.closest('[data-qexp]'))) {
      const k = el.dataset.qexp, all = repo.allActions(), sel = k === 'open' ? all.filter(a => !m.isDone(a)) : k === 'done' ? all.filter(m.isDone) : k === 'pending' ? all.filter(a => ['new', 'changed'].includes(m.excelState(a))) : all;
      if (!sel.length) { toast('Bu seçimde kayıt yok.'); return; }
      exportRows(sel.sort((a, b) => String(a.aksiyonId).localeCompare(String(b.aksiyonId))), 'Teknik_Aksiyonlar_' + ({ all: 'Tumu', open: 'Acik', done: 'Tamamlanan', pending: 'Yeni_ve_Degisen' }[k]) + '_' + m.todayStr() + '.xlsx'); return;
    }
    if (t.closest('[data-rexport]')) { const { arr, rows } = reportData(); exportRows(arr, 'Teknik_Aksiyon_Raporu_' + m.todayStr() + '.xlsx', [['Özet', [['Grup', 'Toplam', 'Açık', 'Tamamlanan', 'Geciken', 'Termin yok', 'Tamamlanma %', 'Ort. süre (gün)']].concat(rows.map(o => [o.k, o.t, o.o, o.d, o.x, o.nt, o.rate, o.avg == null ? '' : Number(o.avg.toFixed(1))]))]]); return; }
    // excel
    if ((el = t.closest('[data-xtab]'))) { ui.excel.tab = el.dataset.xtab; renderExcel($('#content')); return; }
    if ((el = t.closest('[data-xdiff]'))) { const id = el.dataset.xdiff; ui.excel.open.has(id) ? ui.excel.open.delete(id) : ui.excel.open.add(id); renderExcel($('#content')); return; }
    if (t.closest('[data-xpreview]')) { previewBatch(); return; }
    if (t.closest('[data-mclose]') || t.id === 'mscrim') { closeModal(); return; }
    if (t.closest('[data-mconfirm]')) { confirmBatch(); return; }
    if ((el = t.closest('[data-bdl]'))) { downloadBatch(el.dataset.bdl); return; }
    if ((el = t.closest('[data-bcancel]'))) { if (await askConfirm('Parti iptal edilsin mi? Kayıtlar yeniden "aktarılacak" listesine döner.', 'Partiyi iptal et', true)) { await repo.cancelBatch(el.dataset.bcancel); toast('Parti iptal edildi.'); render(); } return; }
    // ayarlar
    if ((el = t.closest('[data-rmlist]'))) { await repo.removeListValue(el.dataset.rmlist, el.dataset.v); rerenderIf('ayarlar', renderAyarlar); return; }
    if ((el = t.closest('[data-seed]'))) {
      el.disabled = true; const n = Number(el.dataset.seed);
      try { await repo.seedSynthetic(n, (i, tot) => { const p = $('#seedProg'); if (p) p.textContent = i + '/' + tot + ' kayıt oluşturuldu…'; }); toast(n + ' sentetik kayıt yüklendi.', 'ok'); }
      catch (err) { toast('Test verisi yüklenemedi: ' + (err.message || err.code), 'bad'); }
      el.disabled = false; rerenderIf('ayarlar', renderAyarlar); return;
    }
    if (t.closest('[data-wipe]')) {
      if (!(await askConfirm('Bu tarayıcıdaki tüm yerel test verisi (aksiyonlar, geçmiş, partiler, listeler) silinsin mi?', 'Sil', true))) return;
      try { Object.keys(localStorage).filter(k => k.startsWith(TAP.storageInternals.LS_PREFIX)).forEach(k => localStorage.removeItem(k)); } catch (e2) { /* yok */ }
      location.reload(); return;
    }
    if ((el = t.closest('[data-th]'))) { prefs('tema', el.dataset.th); applyTheme(); rerenderIf('ayarlar', renderAyarlar); return; }
    if (t.closest('#store')) { go('ayarlar'); return; }
    if (t.closest('[data-login]')) { TAP.auth.login(); return; }
    if (t.closest('[data-logout]')) { TAP.auth.logout(); return; }
    if ((el = t.closest('[data-provision]'))) { doProvision(el); return; }
    if ((el = t.closest('button[data-import]'))) { ui.fileTarget = { k: 'import' }; $('#gFile').click(); return; }
    if ((el = t.closest('button[data-bverify]'))) { ui.fileTarget = { k: 'verify', id: el.dataset.bverify }; $('#gFile').click(); return; }
    if ((el = t.closest('[data-doimport]'))) { runImport(el); return; }
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.matches('[data-xsel]')) { t.checked ? ui.excel.sel.add(t.dataset.xsel) : ui.excel.sel.delete(t.dataset.xsel); renderExcel($('#content')); }
    if (t.matches('[data-xall]')) { $$('[data-xsel]').forEach(c => t.checked ? ui.excel.sel.add(c.dataset.xsel) : ui.excel.sel.delete(c.dataset.xsel)); renderExcel($('#content')); }
    if (t.matches('[data-xfilter]')) { ui.excel.filter = t.value; renderExcel($('#content')); }
    if (t.id === 'ackVerify') { $('[data-mconfirm]').disabled = !t.checked; }
    // Dosya seçimi sayfanın yeniden çizilen bölümlerinin DIŞINDAKİ tek bir girdiyle yapılır (yoklama sırasında seçim kaybolmasın)
    if (t.id === 'gFile' && t.files && t.files[0]) {
      const f = t.files[0], tg = ui.fileTarget; t.value = ''; ui.fileTarget = null;
      if (tg && tg.k === 'import') await doImport(f);
      else if (tg && tg.k === 'verify') await verifyBatch(tg.id, f);
    }
  });
  document.addEventListener('submit', async e => {
    const f = e.target;
    if (f.id === 'numForm') {
      e.preventDefault(); const o = readForm(f);
      const n = { idPrefix: (o.idPrefix || '').trim() || 'TA-', nextSeq: Math.max(1, parseInt(o.nextSeq, 10) || 1), nextIsNo: Math.max(1, parseInt(o.nextIsNo, 10) || 1) };
      await repo.saveNumbering(n); toast('Numaralandırma kaydedildi.', 'ok'); rerenderIf('ayarlar', renderAyarlar);
    }
    if (f.id === 'adminForm') {
      e.preventDefault(); const list = f.emails.value.split(/[\s,;]+/).filter(Boolean);
      if (repo.me && !list.map(x => x.toLowerCase()).includes(repo.me.email)) { if (!(await askConfirm('Kendinizi yönetici listesinden çıkarıyorsunuz. Devam edilsin mi?', 'Kaydet', true))) return; }
      try { await repo.saveAdmins(list); ui.admin = repo.admins.includes(repo.me.email); toast('Panel yöneticileri kaydedildi.', 'ok'); } catch (err) { toast('Kaydedilemedi: ' + err.message, 'bad'); }
      rerenderIf('ayarlar', renderAyarlar); return;
    }
    if (f.dataset.addlist) { e.preventDefault(); const v = f.v.value; if (!v.trim()) return; await repo.addListValue(f.dataset.addlist, v); rerenderIf('ayarlar', renderAyarlar); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#cmodal')) { $('#cmodal [data-c="0"]').click(); } else if (!$('#modal').hidden) closeModal(); else if (ui.drawer) closeDrawer(); } });
  window.addEventListener('hashchange', goRoute);
  window.addEventListener('beforeunload', e => { if (ui.drawer && ui.drawer.dirty) { e.preventDefault(); e.returnValue = ''; } });

  // =====================================================================
  //  BAŞLAT
  // =====================================================================
  function renderShellMinimal() { $('#nav').innerHTML = ''; $('#bnav').innerHTML = ''; $('#store').hidden = true; $$('.new-btn').forEach(b => b.hidden = true); }
  async function start() {
    applyTheme();
    $('#content').innerHTML = '<div class="empty">Veriler yükleniyor…</div>';
    const m365 = window.TAP_CONFIG && window.TAP_CONFIG.mode === 'm365';
    if (m365) {
      try { const acc = await TAP.auth.init(window.TAP_CONFIG); if (!acc) { renderShellMinimal(); renderLogin(); return; } }
      catch (err) { renderShellMinimal(); renderLogin('Giriş başlatılamadı: ' + (err.message || err.errorCode || err)); console.error(err); return; }
    }
    try { await repo.init(); }
    catch (err) { $('#content').innerHTML = '<div class="card"><div class="empty"><b>Depolama başlatılamadı</b>' + esc(err.message || err.code || err) + '</div></div>'; console.error(err); return; }
    ui.writable = await repo.isWritable();
    ui.admin = repo.driver.mode === 'm365' ? (!(repo.admins && repo.admins.length) || !!(repo.me && repo.me.canEdit))
      : (repo.driver.mode !== 'cloud' || !!(repo.me && (repo.me.canEdit || repo.me.isOwner)));
    if (repo.needsSetup) {
      ui.route = 'ayarlar'; renderShell();
      $('#content').innerHTML = '<div class="grid" style="max-width:1080px"><div class="card"><div class="card-b"><b>Panel bu SharePoint sitesinde henüz kurulmadı.</b><p class="help" style="margin:6px 0 0">Bir panel yöneticisi (site sahibi) aşağıdan listeleri oluşturmalıdır. Yetkiniz yoksa BT ekibine veya panel yöneticisine başvurun.</p></div></div>' + m365SetupHTML() + '</div>';
      window.TAP_READY = true; return;
    }
    if (repo.me) await repo.resolveNames([repo.me.id]);
    let nameT;
    repo.on(async what => {
      if (what === 'actions') {
        if (repo.userApi) { const ids = repo.allActions().map(a => a.aksiyonAcanId).filter(id => id && !(id in repo.names)); if (ids.length) { clearTimeout(nameT); nameT = setTimeout(async () => { await repo.resolveNames(ids); refreshOnData(); }, 50); } }
        refreshOnData();
      } else if (what === 'exports') { if (ui.route === 'excel' && $('#modal').hidden) renderExcel($('#content')); }
      else if (what && what.error) { toast('Veritabanı hatası: ' + (what.error.code || what.error.message), 'bad'); }
    });
    goRoute();
    window.TAP_READY = true;
  }
  TAP.ui = { ui, render, openDrawer, start };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(window.TAP);
</script>
</body></html>
