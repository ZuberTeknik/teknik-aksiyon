<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZÜBER Teknik Aksiyon Paneli</title><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; frame-src https://login.microsoftonline.com; base-uri 'none'; form-action 'self' https://login.microsoftonline.com"></head><body>
<meta name="theme-color" content="#15181D">
<style>/* ZÜBER Teknik Aksiyon Paneli V2 — tasarım belirteçleri
   Kurumsal renkler tek yerden değiştirilebilir (--brand*). */
:root {
  --brand: #E8571B;          /* ZÜBER vurgu (turuncu) — kurumsal koda göre güncelleyin */
  --brand-ink: #ffffff;
  --brand-soft: #FDEDE4;
  --nav-bg: #15181D;
  --nav-ink: #C9CED6;
  --nav-ink-active: #ffffff;
  --bg: #F3F4F6;
  --surface: #FFFFFF;
  --surface-2: #F8F9FB;
  --ink: #14171C;
  --ink-2: #3A414C;
  --muted: #667085;
  --line: #E4E7EC;
  --line-strong: #D0D5DD;
  --focus: #2E6BE6;
  --ok: #067647; --ok-bg: #DCFAE6;
  --info: #175CD3; --info-bg: #D1E9FF;
  --warn: #B54708; --warn-bg: #FEF0C7;
  --bad: #C01F14; --bad-bg: #FEE4E2;
  --neutral-bg: #EEF0F3;
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.16);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1115; --surface: #171A20; --surface-2: #1D2128; --ink: #ECEEF1; --ink-2: #C8CDD5; --muted: #98A2B3;
    --line: #2A2F38; --line-strong: #39404B; --brand-soft: #3A2116; --neutral-bg: #232830;
    --ok: #47CD89; --ok-bg: #0B3B25; --info: #84ADFF; --info-bg: #12284F; --warn: #FDB022; --warn-bg: #3D2A06; --bad: #FF8A80; --bad-bg: #4A1512;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1115; --surface: #171A20; --surface-2: #1D2128; --ink: #ECEEF1; --ink-2: #C8CDD5; --muted: #98A2B3;
  --line: #2A2F38; --line-strong: #39404B; --brand-soft: #3A2116; --neutral-bg: #232830;
  --ok: #47CD89; --ok-bg: #0B3B25; --info: #84ADFF; --info-bg: #12284F; --warn: #FDB022; --warn-bg: #3D2A06; --bad: #FF8A80; --bad-bg: #4A1512;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- yerleşim ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side { background: var(--nav-bg); color: var(--nav-ink); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 18px 12px; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; letter-spacing: -.5px; }
.side-brand .brand-txt b { display: block; color: #fff; font-size: 17px; letter-spacing: .5px; }
.side-brand .brand-txt span { font-size: 12px; color: #8A93A1; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; text-decoration: none; font-weight: 500; font-size: 14.5px; }
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.on { background: rgba(255,255,255,.1); color: var(--nav-ink-active); box-shadow: inset 3px 0 0 var(--brand); }
.nav .cnt { margin-left: auto; font-size: 12px; background: rgba(255,255,255,.1); padding: 1px 8px; border-radius: 99px; }
.nav .cnt.bad { background: var(--bad); color: #fff; }
.nav-sep { height: 1px; background: rgba(255,255,255,.08); margin: 10px 8px; }
.side-foot { margin-top: auto; font-size: 12px; padding: 10px; color: #8A93A1; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 12px 28px; }
.top h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
.top .sp { flex: 1; }
.store-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 99px; border: 1px solid transparent; cursor: pointer; background: none; }
.store-badge.cloud { background: var(--ok-bg); color: var(--ok); }
.store-badge.local { background: var(--warn-bg); color: var(--warn); }
.store-badge.memory { background: var(--bad-bg); color: var(--bad); }
.store-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.user-chip { font-size: 13px; color: var(--muted); }
.content { padding: 24px 28px 48px; max-width: 1440px; width: 100%; }
.banner { margin: 16px 28px 0; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }

/* ---------- düğmeler ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { filter: brightness(.95); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .combo-input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- kartlar ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
.card-h h2 { font-size: 15px; margin: 0; font-weight: 700; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.card-b { padding: 14px 18px 18px; }
.grid { display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { padding: 16px; position: relative; overflow: hidden; cursor: pointer; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi:hover { border-color: var(--line-strong); }
.kpi .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.kpi .val { font-size: 30px; font-weight: 750; letter-spacing: -.8px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent, var(--line-strong)); }
.kpi.bad .val { color: var(--bad); } .kpi.bad { --accent: var(--bad); }
.kpi.warn .val { color: var(--warn); } .kpi.warn { --accent: var(--warn); }
.kpi.ok { --accent: var(--ok); } .kpi.info { --accent: var(--info); } .kpi.brand { --accent: var(--brand); }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

/* dağılım çubukları */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 13.5px; }
.bar-row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row .nums { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.bar-track { grid-column: 1 / -1; height: 8px; background: var(--neutral-bg); border-radius: 99px; overflow: hidden; display: flex; }
.bar-track i { display: block; height: 100%; }
.bar-track i.o { background: var(--info); } .bar-track i.d { background: color-mix(in srgb, var(--ok) 55%, transparent); } .bar-track i.x { background: var(--bad); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: -1px; }

/* ---------- rozetler ---------- */
.b { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; line-height: 18px; }
.b.open { background: var(--info-bg); color: var(--info); }
.b.prog { background: #EBE9FE; color: #5925DC; }
.b.hold { background: var(--neutral-bg); color: var(--ink-2); }
.b.done { background: var(--ok-bg); color: var(--ok); }
.b.overdue { background: var(--bad); color: #fff; }
.b.upcoming { background: var(--warn-bg); color: var(--warn); }
.b.none { background: var(--neutral-bg); color: var(--muted); }
.b.crit { background: var(--bad-bg); color: var(--bad); }
.b.high { background: var(--warn-bg); color: var(--warn); }
.b.x-new { background: var(--neutral-bg); color: var(--ink-2); }
.b.x-changed { background: var(--warn-bg); color: var(--warn); }
.b.x-pending { background: var(--info-bg); color: var(--info); }
.b.x-synced { background: var(--ok-bg); color: var(--ok); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .b.prog { background: #2A1F5C; color: #BDB4FE; } }

/* ---------- liste araç çubuğu ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { position: relative; flex: 1 1 280px; min-width: 200px; }
.search input { width: 100%; height: 40px; padding: 0 12px 0 38px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
.search svg { position: absolute; left: 12px; top: 11px; color: var(--muted); }
.fsel { height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 0 32px 0 12px; max-width: 200px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.fsel.on { border-color: var(--brand); background-color: var(--brand-soft); }
.resinfo { color: var(--muted); font-size: 13px; margin: -4px 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- tablo ---------- */
.tbl-wrap { overflow: auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.t th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.t th.s { cursor: pointer; } .t th.s:hover { color: var(--ink); }
.t th .ar { opacity: .35; margin-left: 4px; } .t th.sorted .ar { opacity: 1; color: var(--brand); }
.t td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr { cursor: pointer; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.row-overdue td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.t tr.row-crit td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
.t .id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.t .konu { min-width: 240px; max-width: 420px; font-weight: 550; }
.t .konu small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
.t .nw { white-space: nowrap; }
.t .muted { color: var(--muted); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }

/* mobil kartlar */
.mlist { display: none; flex-direction: column; gap: 10px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); position: relative; }
.mcard.overdue { border-left: 4px solid var(--bad); }
.mcard .r1 { display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.mcard .r1 .id { font-family: ui-monospace, Menlo, monospace; }
.mcard h3 { font-size: 15.5px; margin: 6px 0 4px; line-height: 1.35; }
.mcard .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.mcard .r3 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.mcard .r3 .btn { margin-left: auto; }

/* ---------- form ---------- */
.form { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px 18px; }
.f { grid-column: span 4; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.f.w6 { grid-column: span 6; } .f.w12 { grid-column: span 12; } .f.w3 { grid-column: span 3; }
.f > label, .f > .lbl { font-size: 13px; font-weight: 600; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
.f .req { color: var(--bad); }
.f .help { font-size: 12px; color: var(--muted); font-weight: 400; }
.inp, .f textarea, .f select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
.f textarea { min-height: 84px; resize: vertical; }
.inp[readonly] { background: var(--surface-2); color: var(--muted); }
.inp.err, .combo.err .combo-input { border-color: var(--bad); }
.seg { display: flex; border: 1px solid var(--line-strong); border-radius: 10px; overflow: hidden; height: 44px; }
.seg button { flex: 1; border: 0; background: var(--surface); font-size: 13.5px; font-weight: 600; cursor: pointer; border-left: 1px solid var(--line); color: var(--ink-2); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--ink); color: var(--surface); }
.seg button.on[data-v="Kritik"] { background: var(--bad); color: #fff; }
.seg button.on[data-v="Yüksek"] { background: var(--warn); color: #fff; }
.seg button.on[data-v="Tamamlandı"] { background: var(--ok); color: #fff; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; grid-column: span 12; }
.section-title { grid-column: span 12; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; margin: 6px 0 -6px; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.autofield { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line-strong); font-family: ui-monospace, Menlo, monospace; font-size: 14px; color: var(--ink-2); }

/* aranabilir seçim */
.combo { position: relative; }
.combo-input { width: 100%; min-height: 44px; padding: 10px 36px 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
.combo .chev { position: absolute; right: 12px; top: 13px; color: var(--muted); pointer-events: none; }
.combo .clear { position: absolute; right: 30px; top: 9px; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; display: none; }
.combo.has .clear { display: block; }
.combo-list { position: absolute; z-index: 60; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow-lg); max-height: 280px; overflow: auto; padding: 4px; display: none; }
.combo.open .combo-list { display: block; }
.combo-opt { padding: 10px 10px; border-radius: 7px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; white-space: pre; }
.combo-opt .ws { color: var(--warn); font-size: 11px; }
.combo-opt.act, .combo-opt:hover { background: var(--surface-2); }
.combo-opt.sel { font-weight: 700; }
.combo-opt.new { color: var(--brand); font-weight: 600; border-top: 1px solid var(--line); margin-top: 4px; }
.combo-none { padding: 10px; color: var(--muted); font-size: 13px; }

/* ---------- çekmece (düzenleme) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15,17,21,.45); z-index: 80; opacity: 0; transition: opacity .18s; }
.scrim.on { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 90; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease; box-shadow: var(--shadow-lg); }
.drawer.on { transform: none; }
.drawer-h { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.drawer-h .ttl { min-width: 0; }
.drawer-h .ttl .id { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--muted); }
.drawer-h .ttl b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-tabs { overflow-x: auto; display: flex; gap: 4px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.drawer-tabs button { border: 0; background: none; padding: 12px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
.drawer-tabs button.on { color: var(--ink); border-color: var(--brand); }
.drawer-b { flex: 1; overflow: auto; padding: 20px; }
.drawer-f { padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.drawer-f .sp { flex: 1; }
.meta-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.meta-grid div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.meta-grid > div > span:first-child { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }

.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 18px 26px; }
.timeline li::before { content: ""; position: absolute; left: 6px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
.timeline li::after { content: ""; position: absolute; left: 10px; top: 18px; bottom: 0; width: 1px; background: var(--line-strong); }
.timeline li:last-child::after { display: none; }
.timeline .h { font-size: 13px; color: var(--muted); }
.timeline .h b { color: var(--ink); }
.chg { font-size: 13px; margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.chg div { padding: 2px 0; }
.chg del { color: var(--bad); text-decoration: line-through; } .chg ins { color: var(--ok); text-decoration: none; font-weight: 600; }

/* ---------- modal ---------- */
.modal { position: fixed; z-index: 95; left: 50%; top: 50%; transform: translate(-50%, -48%) scale(.98); width: min(860px, calc(100% - 32px)); max-height: calc(100% - 48px); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; opacity: 0; transition: .18s; }
.modal.on { opacity: 1; transform: translate(-50%, -50%); }
.modal-h { padding: 18px 20px 10px; } .modal-h h2 { margin: 0; font-size: 18px; } .modal-h p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.modal-b { padding: 8px 20px; overflow: auto; }
.modal-f { padding: 14px 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* ---------- toast ---------- */
.toasts { position: fixed; z-index: 120; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow-lg); animation: tin .2s; max-width: calc(100vw - 32px); }
.toast.bad { background: var(--bad); color: #fff; } .toast.ok { background: var(--ok); color: #fff; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

/* ---------- excel merkezi ---------- */
.steps { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.step { flex: 1 1 180px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--muted); }
.step b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }
.step .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 12px; margin-right: 6px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.tabs button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.diff { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 14px; }
.diff th, .diff td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.diff th { color: var(--muted); font-weight: 600; font-size: 12px; }
.diff td.o { color: var(--bad); } .diff td.n { color: var(--ok); font-weight: 600; }
.adapters { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.adapter { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--muted); background: var(--surface); }
.adapter b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 13.5px; }
.chk { width: 18px; height: 18px; accent-color: var(--brand); }

/* ---------- ayarlar ---------- */
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 8px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; border-radius: 99px; background: var(--neutral-bg); font-size: 13px; white-space: pre; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-top: 10px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; }

/* ---------- alt gezinme (mobil) ---------- */
.bnav { display: none; }
.fab { display: none; }

/* ---------- duyarlı ---------- */
@media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .cols-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .top { padding: 10px 16px; }
  .top h1 { font-size: 18px; }
  .top .new-btn, .user-chip { display: none; }
  .content { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
  .banner { margin: 12px 16px 0; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 12px 14px; } .kpi .val { font-size: 26px; }
  .cols-3, .cols-2 { grid-template-columns: 1fr; }
  .form { grid-template-columns: 1fr; gap: 14px; }
  .f, .f.w6, .f.w3, .f.w12, .section-title, .form-actions { grid-column: 1 / -1; }
  .form-actions.sticky { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom)); background: var(--bg); padding: 10px 0; margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-top: 1px solid var(--line); z-index: 5; }
  .form-actions .btn { flex: 1; height: 48px; }
  .tbl-wrap.resp { display: none; }
  .mlist { display: flex; }
  .fsel { max-width: none; flex: 1 1 calc(50% - 10px); }
  .search { flex-basis: 100%; }
  .meta-grid { grid-template-columns: 1fr 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 10px; }
  .drawer { width: 100%; }
  .modal { width: 100%; max-height: 92%; top: auto; bottom: 0; left: 0; transform: translateY(20px); border-radius: 16px 16px 0 0; }
  .modal.on { transform: none; }
  .bnav { display: flex; position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; text-decoration: none; color: var(--muted); padding: 4px 0; position: relative; }
  .bnav a.on { color: var(--brand); }
  .bnav a .dotc { position: absolute; top: 0; left: calc(50% + 6px); background: var(--bad); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; }
  .bnav a.plus svg { width: 26px; height: 26px; background: var(--brand); color: #fff; border-radius: 12px; padding: 4px; box-sizing: content-box; margin-top: -2px; }
  .menu-sheet .nav a { color: var(--ink); } .menu-sheet .nav a.on { background: var(--brand-soft); box-shadow: none; }
  .toasts { bottom: calc(80px + env(safe-area-inset-bottom)); }
}

@media (max-width: 900px) { .only-d { display: none !important; } }

.cols-2 > *, .cols-3 > *, .kpis > *, .grid > * { min-width: 0; }
@media (max-width: 900px) { .card .t .konu { min-width: 160px; } }
.btn { text-decoration: none; }
.card-h { flex-wrap: wrap; }
.ftoggle { display: none; }
@media (max-width: 900px) {

/* giriş ekranı */
.login-mode .app { grid-template-columns: 1fr; }
.login-mode .side, .login-mode .bnav, .login-mode .top { display: none; }
.user-chip { display: inline-flex; align-items: center; gap: 6px; }

/* ---- V2.1: dashboard özetleri, halka grafik, trend ---- */
.kpis.k8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.dash-sum, .dash-ch { margin-bottom: 16px; }
.dash-sum .card-h { flex-wrap: wrap; }
.dsum .t td, .dsum .t th { padding-top: 9px; padding-bottom: 9px; }

.dsum-m { display: none; }
@media (max-width: 1400px) { .dash-sum { grid-template-columns: 1fr !important; } }
@media (max-width: 900px) {
  .kpis.k8 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dsum { display: none; } .dsum-m { display: flex; }
  .dash-ch { grid-template-columns: 1fr !important; }
}
.donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center; }
.donut { width: 168px; height: 168px; flex: none; }
.donut circle[data-kpi]:hover { opacity: .85; }
.donut .dn-v { font-size: 22px; font-weight: 700; fill: var(--ink); }
.donut .dn-l { font-size: 10px; fill: var(--muted); }
.donut-leg { display: flex; flex-direction: column; gap: 6px; min-width: 180px; }
.donut-leg button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; cursor: pointer; font: inherit; color: var(--ink); text-align: left; min-height: 44px; }
.donut-leg button:hover { border-color: var(--line-strong); background: var(--surface-2); }
.donut-leg i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.donut-leg span { flex: 1; font-size: 13px; color: var(--ink-2); }
.chart svg .ax { font-size: 10px; fill: var(--muted); }
.chart svg .wk:hover rect:first-child { fill: var(--surface-2); }

/* ---- V2.1: yeni aksiyon formu ---- */
.grp { grid-column: span 12; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 16px; background: var(--surface); }
.grp > h3 { grid-column: span 12; margin: 0; font-size: 13px; letter-spacing: .3px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; }
.grp > h3 .n { width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--brand-ink); display: inline-grid; place-items: center; font-size: 12px; }
.grp.sys { background: var(--surface-2); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.quick button { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); border-radius: 99px; padding: 6px 12px; min-height: 36px; font: inherit; font-size: 13px; cursor: pointer; }
.quick button.on { background: var(--brand-soft); border-color: var(--brand); color: var(--ink); }
.f .ferr { color: var(--bad); font-size: 12px; font-weight: 600; }
.f.has-err textarea, .f.has-err .inp { border-color: var(--bad); }
.f.has-err .combo-input { border-color: var(--bad); }
.req-note { font-size: 12px; color: var(--muted); }
.req-note b { color: var(--bad); }
.success { text-align: center; padding: 34px 20px; }
.success .ok-ic { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); display: inline-grid; place-items: center; margin-bottom: 10px; }
.success .ok-ic svg { width: 28px; height: 28px; }
.success h2 { margin: 4px 0 6px; font-size: 20px; }
.success .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.success .acts .btn { min-height: 48px; }
@media (max-width: 900px) { .grp { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 12px; } .grp > .f, .grp > h3, .req-note { grid-column: 1 / -1 !important; } .success .acts .btn { flex: 1 1 100%; } }

/* ---- V2.1: sayfalama, silme, özet ---- */
.pager { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.pager .btn { min-width: 40px; }
.pager .btn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pager select { min-height: 36px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); padding: 0 8px; }
.dsummary { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px; background: var(--surface-2); }
.dsummary.done { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); background: color-mix(in srgb, var(--ok-bg) 45%, var(--surface)); }

.dsummary p { margin: 0 0 10px; white-space: pre-wrap; }
.dsummary .row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.btn.danger-ghost { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, var(--line-strong)); }
.deleted-note { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
.drange { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.drange input { max-width: 150px; }
@media (max-width: 900px) { .drange { display: none; width: 100%; } .toolbar.show-f .drange { display: flex; } .drange input { max-width: none; flex: 1; } }
/* Mobilde sistem alanları varsayılan kapalı (sahada daha az kaydırma) */
@media (max-width: 900px) { .grp.fold:not(.open) > .f { display: none; } .grp.fold > h3 { cursor: pointer; min-height: 32px; } }
@media (min-width: 901px) { .grp.fold > h3 .help { display: none; } }
.qexp { display: flex; gap: 10px; flex-wrap: wrap; } @media (max-width: 900px) { .qexp .btn { flex: 1 1 100%; justify-content: flex-start; min-height: 48px; } }

<script>window.TAP = window.TAP || {}; TAP.SEED_LISTS = {};
/* ZÜBER Teknik Aksiyon Paneli V2 — veri modeli
 * Excel alan adları birebir korunur (EXCEL_FIELDS). Panel içinde her alan bir anahtarla tutulur.
 * Aksiyon ID benzersiz kayıt anahtarıdır; İş No ayrı ve düzenlenebilir bir alandır.
 */
window.TAP = window.TAP || {};
(function (TAP) {
  'use strict';

  // Excel'deki sütun sırası ve adları (Tablo3, A:O)
  const EXCEL_FIELDS = [
    { key: 'isNo', label: 'İş No', type: 'number' },
    { key: 'firma', label: 'Firma', type: 'list' },
    { key: 'hat', label: 'Hat', type: 'list' },
    { key: 'konu', label: 'Konu', type: 'text' },
    { key: 'alinacakAksiyon', label: 'Alınacak Aksiyon', type: 'text' },
    { key: 'aksiyonAcan', label: 'Aksiyon Açan', type: 'person' },
    { key: 'talepTarihi', label: 'Talep Tarihi', type: 'date' },
    { key: 'talepEden', label: 'Talep Eden', type: 'list' },
    { key: 'sorumluDepartman', label: 'Sorumlu Departman', type: 'list' },
    { key: 'sorumluPersonel', label: 'Sorumlu Personel', type: 'list' },
    { key: 'onay', label: 'Onay', type: 'enum' },
    { key: 'terminTarihi', label: 'Termin Tarihi', type: 'date' },
    { key: 'tamamlanmaTarihi', label: 'Tamamlanma Tarihi', type: 'date' },
    { key: 'durum', label: 'Durum', type: 'enum' },
    { key: 'aksiyonId', label: 'Aksiyon ID', type: 'id' },
  ];
  // Panelde olup Excel'de karşılığı olmayan ek alan
  const EXTRA_FIELDS = [{ key: 'oncelik', label: 'Öncelik', type: 'enum' }, { key: 'kapanisAciklamasi', label: 'Kapanış açıklaması', type: 'text' }];

  const DURUMLAR = ['Açık', 'Devam Ediyor', 'Beklemede', 'Tamamlandı'];
  const ONAYLAR = ['', 'Onay Bekliyor', 'Onaylandı', 'Reddedildi'];
  const ONCELIKLER = ['Düşük', 'Normal', 'Yüksek', 'Kritik'];
  const LIST_KEYS = ['firma', 'hat', 'talepEden', 'sorumluDepartman', 'sorumluPersonel'];
  const LIST_LABELS = { firma: 'Firma', hat: 'Hat', talepEden: 'Talep Eden', sorumluDepartman: 'Sorumlu Departman', sorumluPersonel: 'Sorumlu Personel' };
  const UPCOMING_DAYS = 7;

  // ---- tarih yardımcıları (yerel saat, YYYY-MM-DD) ----
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(str, n) { const [y, m, d] = str.split('-').map(Number); return todayStr(new Date(y, m - 1, d + n)); }
  function daysBetween(a, b) { // b - a, gün
    const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
    return Math.round((Date.UTC(y2, m2 - 1, d2) - Date.UTC(y1, m1 - 1, d1)) / 86400000);
  }
  function fmtDate(str) { if (!str) return ''; const [y, m, d] = str.split('-'); return d + '.' + m + '.' + y; }
  function fmtDateTime(iso) {
    if (!iso) return ''; const d = new Date(iso);
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ---- durum türetmeleri ----
  function isDone(a) { return a.durum === 'Tamamlandı'; }
  // Termin tarihi olmayan kayıt gecikmiş SAYILMAZ.
  function isOverdue(a, today) { return !isDone(a) && !!a.terminTarihi && a.terminTarihi < (today || todayStr()); }
  function isUpcoming(a, today) {
    today = today || todayStr();
    return !isDone(a) && !!a.terminTarihi && a.terminTarihi >= today && a.terminTarihi <= addDays(today, UPCOMING_DAYS);
  }
  function terminState(a, today) {
    if (isDone(a)) return 'done';
    if (!a.terminTarihi) return 'none';
    if (isOverdue(a, today)) return 'overdue';
    if (isUpcoming(a, today)) return 'upcoming';
    return 'ok';
  }

  // Excel aktarım durumu kayıt meta verisinden türetilir
  function excelState(a) {
    const x = a.excel || {};
    if (x.bekleyenBatch && x.bekleyenSurum === a.surum) return 'pending';
    if (x.sonBasariliSurum == null) return 'new';
    if (a.surum > x.sonBasariliSurum) return 'changed';
    return 'synced';
  }
  const EXCEL_STATE_LABEL = { new: 'Senkronizasyon bekliyor (yeni)', changed: 'Senkronizasyon bekliyor (değişti)', pending: 'Doğrulama bekliyor', synced: 'Excel\'de (doğrulandı)' };

  // Kayıt -> Excel satırı (15 sütun, Excel adlarıyla)
  function toExcelRow(a, resolveName) {
    const row = {};
    for (const f of EXCEL_FIELDS) {
      let v = a[f.key];
      if (f.key === 'aksiyonAcan') v = resolveName ? resolveName(a) : (a.aksiyonAcan || '');
      if (f.key === 'durum') v = isDone(a) ? '✔' : ''; // Excel'deki mevcut kullanım: ✔ = tamamlandı
      if (v == null) v = '';
      row[f.label] = v;
    }
    return row;
  }

  function diffRows(oldRow, newRow) {
    const out = [];
    for (const f of EXCEL_FIELDS) {
      const o = oldRow ? (oldRow[f.label] ?? '') : '';
      const n = newRow[f.label] ?? '';
      if (String(o) !== String(n)) out.push({ alan: f.label, eski: o, yeni: n });
    }
    return out;
  }

  // Normalize: benzer yazım tespiti (BİRLEŞTİRMEZ, sadece uyarı için)
  function normKey(s) {
    return String(s).toLocaleLowerCase('tr').replace(/\s+/g, '').replace(/[.\-_/]/g, '');
  }
  function similarGroups(values) {
    const m = new Map();
    for (const v of values) { const k = normKey(v); if (!m.has(k)) m.set(k, []); m.get(k).push(v); }
    return [...m.values()].filter(g => g.length > 1);
  }

  // Hafta: Pazartesi başlangıçlı (TR). weekStart('2026-10-23') -> '2026-10-19'
  function weekStart(str) { const [y, mo, d] = str.split('-').map(Number); const dt = new Date(y, mo - 1, d); const wd = (dt.getDay() + 6) % 7; return todayStr(new Date(y, mo - 1, d - wd)); }
  function inWeek(str, today) { if (!str) return false; const ws = weekStart(today || todayStr()); return str >= ws && str <= addDays(ws, 6); }
  // Kapanış süresi (gün): talep -> tamamlanma. Bilinmiyorsa null.
  function closeDays(a) { return (isDone(a) && a.talepTarihi && a.tamamlanmaTarihi) ? daysBetween(a.talepTarihi, a.tamamlanmaTarihi) : null; }
  // Yeni aksiyonda zorunlu alanlar (sahadaki akış: tesis, hat, sorun, aksiyon, sorumlu)
  const REQUIRED_NEW = ['firma', 'hat', 'konu', 'alinacakAksiyon'];
  function validateNew(o) {
    const err = {};
    for (const k of REQUIRED_NEW) if (!o[k] || !String(o[k]).trim()) err[k] = 'Zorunlu alan';
    if (!(o.sorumluDepartman && o.sorumluDepartman.trim()) && !(o.sorumluPersonel && o.sorumluPersonel.trim())) err.sorumluDepartman = 'Sorumlu departman veya personel seçin';
    if (o.terminTarihi && o.talepTarihi && o.terminTarihi < o.talepTarihi) err.terminTarihi = 'Termin, talep tarihinden önce olamaz';
    return err;
  }

  function formatId(prefix, n) { return prefix + String(n).padStart(4, '0'); }
  function parseIdNum(id, prefix) {
    if (!id || !id.startsWith(prefix)) return null;
    const n = parseInt(id.slice(prefix.length), 10); return Number.isFinite(n) ? n : null;
  }

  TAP.model = {
    EXCEL_FIELDS, EXTRA_FIELDS, DURUMLAR, ONAYLAR, ONCELIKLER, LIST_KEYS, LIST_LABELS, UPCOMING_DAYS,
    todayStr, addDays, daysBetween, fmtDate, fmtDateTime,
    isDone, isOverdue, isUpcoming, terminState, excelState, EXCEL_STATE_LABEL,
    toExcelRow, diffRows, normKey, similarGroups, formatId, parseIdNum,
    weekStart, inWeek, closeDays, REQUIRED_NEW, validateNew,
  };
})(window.TAP);

/* Depolama katmanı
 *  - DbDriver   : claude.ai Artifact "db" yeteneği (sunucu tarafı, kalıcı, paylaşımlı)  -> ÜRETİM HEDEFİ
 *  - LocalDriver: tarayıcı localStorage — YALNIZCA yerel test modu. Arayüzde açıkça
 *                 "Yerel test — bu tarayıcıya özel, bulut değil" olarak etiketlenir.
 *  - MemoryDriver: localStorage da kullanılamazsa geçici bellek (kalıcı değil).
 * Üst katman (TAP.repo) sürücüden bağımsızdır; ileride Microsoft Graph / SharePoint List
 * gibi başka bir sürücü aynı arayüzle eklenebilir.
 */
window.TAP = window.TAP || {};
(function (TAP) {
  'use strict';
  const M = () => TAP.model;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  function deepMerge(base, patch) {
    const out = Object.assign({}, base);
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) out[k] = deepMerge(base[k], v);
      else out[k] = v;
    }
    return out;
  }

  // ---------------- Artifact db sürücüsü ----------------
  function DbDriver(db) {
    this.mode = 'cloud';
    this.label = 'Bulut — claude.ai Artifact veritabanı';
    this.persistent = true; this.shared = true;
    this.db = db;
  }
  DbDriver.prototype.get = async function (coll, id) {
    const s = await this.db.collection(coll).doc(id).get();
    return s.exists ? clone(s.data()) : null;
  };
  DbDriver.prototype.set = async function (coll, id, data) { await this.db.collection(coll).doc(id).set(clone(data)); };
  DbDriver.prototype.remove = async function (coll, id) { await this.db.collection(coll).doc(id).delete(); };
  DbDriver.prototype.query = async function (coll, field, value) {
    const s = await this.db.collection(coll).where(field, '==', value).limit(500).get();
    return s.docs.map(d => Object.assign({ _id: d.id }, clone(d.data())));
  };
  DbDriver.prototype.list = async function (coll) {
    const s = await this.db.collection(coll).limit(1000).get();
    return s.docs.map(d => Object.assign({ _id: d.id }, clone(d.data())));
  };
  DbDriver.prototype.watch = function (coll, cb, onErr) {
    return this.db.collection(coll).limit(1000).onSnapshot(
      snap => cb(snap.docs.map(d => Object.assign({ _id: d.id }, d.data()))),
      e => onErr && onErr(e));
  };
  DbDriver.prototype.watchDoc = function (coll, id, cb, onErr) {
    return this.db.collection(coll).doc(id).onSnapshot(s => cb(s.exists ? s.data() : null), e => onErr && onErr(e));
  };
  DbDriver.prototype.lock = async function (name, holder, ttlMs) {
    const r = await this.db.doc('locks/' + name).acquire({ holder, ttlMs: ttlMs || 8000 });
    return !!r.acquired;
  };

  // ---------------- Yerel test sürücüsü ----------------
  const LS_PREFIX = 'zuber-tap-v2:yerel-test:';
  function LocalDriver(storage, memory) {
    this.mode = memory ? 'memory' : 'local';
    this.label = memory ? 'Geçici bellek — sayfa kapanınca silinir' : 'Yerel test — yalnızca bu tarayıcıda, bulut değil';
    this.persistent = !memory; this.shared = false;
    this.ls = storage; this.mem = {}; this.watchers = {};
    const self = this;
    if (!memory) window.addEventListener('storage', e => {
      if (e.key && e.key.startsWith(LS_PREFIX)) self._notify(e.key.slice(LS_PREFIX.length));
    });
  }
  LocalDriver.prototype._read = function (coll) {
    if (!this.ls) return this.mem[coll] || {};
    try { return JSON.parse(this.ls.getItem(LS_PREFIX + coll) || '{}'); } catch (e) { return {}; }
  };
  LocalDriver.prototype._write = function (coll, obj) {
    if (!this.ls) { this.mem[coll] = obj; return; }
    this.ls.setItem(LS_PREFIX + coll, JSON.stringify(obj));
  };
  LocalDriver.prototype._notify = function (coll) {
    const list = this.listSync(coll);
    (this.watchers[coll] || []).forEach(cb => cb(list));
    const all = this._read(coll);
    (this.watchers['doc:' + coll] || []).forEach(w => w.cb(all[w.id] ? clone(all[w.id]) : null));
  };
  LocalDriver.prototype.listSync = function (coll) {
    const o = this._read(coll); return Object.keys(o).sort().map(k => Object.assign({ _id: k }, o[k]));
  };
  LocalDriver.prototype.get = async function (coll, id) { const o = this._read(coll); return o[id] ? clone(o[id]) : null; };
  LocalDriver.prototype.set = async function (coll, id, data) { const o = this._read(coll); o[id] = clone(data); this._write(coll, o); this._notify(coll); };
  LocalDriver.prototype.remove = async function (coll, id) { const o = this._read(coll); delete o[id]; this._write(coll, o); this._notify(coll); };
  LocalDriver.prototype.query = async function (coll, field, value) { return this.listSync(coll).filter(d => d[field] === value); };
  LocalDriver.prototype.list = async function (coll) { return this.listSync(coll); };
  LocalDriver.prototype.watch = function (coll, cb) {
    (this.watchers[coll] = this.watchers[coll] || []).push(cb);

  };

    const w = { id, cb }; (this.watchers['doc:' + coll] = this.watchers['doc:' + coll] || []).push(w);

    return () => { this.watchers['doc:' + coll] = this.watchers['doc:' + coll].filter(x => x !== w); };
  };
  LocalDriver.prototype.lock = async function () { return true; };

  // ---------------- sürücü seçimi ----------------
  async function pickDriver() {
    // Microsoft 365 dağıtımı: ayarlar.js -> TAP_CONFIG.mode === 'm365'
    if (window.TAP_CONFIG && window.TAP_CONFIG.mode === 'm365' && TAP.GraphDriver) {
      return { driver: new TAP.GraphDriver(window.TAP_CONFIG, TAP.auth), user: null };
    }
    // Artifact olarak açıldıysa platform window.claude sağlar
    if (window.claude && typeof window.claude.use === 'function') {
      try {
        const db = await window.claude.use('db');
        if (db) {
          let user = null;
          try { user = await window.claude.use('user'); } catch (e) { user = null; }
          return { driver: new DbDriver(db), user };
        }
      } catch (e) { /* düş */ }
      // Artifact içinde ama db yok (oturum kapalı / yetki yok): yerel moda düşme, salt okunur uyarı ver
      return { driver: new LocalDriver(null, true), user: null, dbUnavailable: true };
    }
    let ls = null;
    try { ls = window.localStorage; const k = LS_PREFIX + '__t'; ls.setItem(k, '1'); ls.removeItem(k); } catch (e) { ls = null; }
    return { driver: new LocalDriver(ls, !ls), user: null };
  }

  // ======================= REPOSITORY =======================
  const repo = {
    driver: null, userApi: null, me: null, dbUnavailable: false,
    actions: new Map(), lists: null, numbering: null, batches: [],
    listeners: new Set(), tabId: rid(), names: {},
  };

  repo.on = function (fn) { repo.listeners.add(fn); return () => repo.listeners.delete(fn); };
  repo.emit = function (what) { repo.listeners.forEach(fn => { try { fn(what); } catch (e) { console.error(e); } }); };

  repo.init = async function () {
    const p = await pickDriver();
    repo.driver = p.driver; repo.userApi = p.user; repo.dbUnavailable = !!p.dbUnavailable;
    if (repo.driver.mode === 'm365') {
      await repo.driver.init();
      const me = TAP.auth.me(); if (me) repo.me = { id: me.id, name: me.name, email: me.email, canEdit: false, isOwner: false };
      if (!repo.driver.ready()) { repo.needsSetup = true; repo.admins = []; return repo; }
      const yon = await repo.driver.get('config', 'yoneticiler');
      repo.admins = ((yon && yon.emails) || []).map(e => String(e).toLowerCase());
      if (repo.me) repo.me.canEdit = repo.me.isOwner = repo.admins.includes(repo.me.email);
    }
    if (repo.userApi) {
      try {
        const me = await repo.userApi.me();
        if (me && me.id) repo.me = { id: me.id, name: me.name || '', canEdit: !!me.canEdit, isOwner: !!me.isOwner };
      } catch (e) { repo.me = null; }
    }
    // liste ve numaralandırma ayarları
    repo.lists = await repo.driver.get('config', 'lists');
    if (!repo.lists) repo.lists = clone(TAP.SEED_LISTS || {}); // ilk yazım kullanıcı eylemiyle yapılır
    repo.numbering = (await repo.driver.get('config', 'numbering')) || { idPrefix: 'TEST-', nextSeq: 1, nextIsNo: 1 };

    await new Promise(resolve => {
      let first = true;
      repo.unsubActions = repo.driver.watch('actions', list => {
        repo.actions = new Map(list.map(a => [a.aksiyonId || a._id, a]));
        repo.emit('actions');
        if (first) { first = false; resolve(); }
      }, err => { repo.emit({ error: err }); if (first) { first = false; resolve(); } });
    });
    repo.unsubBatches = repo.driver.watch('exports', list => { repo.batches = list.sort((a, b) => (b.olusturma || '').localeCompare(a.olusturma || '')); repo.emit('exports'); });
    repo.driver.watchDoc('config', 'lists', d => { if (d) { repo.lists = d; repo.emit('lists'); } });
    repo.driver.watchDoc('config', 'numbering', d => { if (d) { repo.numbering = d; repo.emit('numbering'); } });
    return repo;
  };

  // Silinen kayıtlar (yumuşak silme) listelerde, dashboard'da ve Excel aktarımında görünmez;
  // numaralandırmada sayılmaya devam eder, böylece aynı Aksiyon ID tekrar verilmez.
  repo.allActions = () => [...repo.actions.values()].filter(a => !a.silindi);
  repo.deletedActions = () => [...repo.actions.values()].filter(a => a.silindi);

  // ----- kimlik / isim çözümleme -----
  repo.resolveNames = async function (ids) {
    ids = [...new Set(ids.filter(Boolean))];
    if (!repo.userApi || !ids.length) return repo.names;
    try { const ps = await repo.userApi.profiles(ids); for (const id of ids) repo.names[id] = (ps[id] && ps[id].name) || ''; } catch (e) { /* yok say */ }
    return repo.names;
  };
  repo.acanName = function (a) {
    if (a.aksiyonAcanId) return repo.names[a.aksiyonAcanId] || a.aksiyonAcan || '';
    return a.aksiyonAcan || '';
  };

  // ----- kilit -----
  async function withLock(name, fn) {
    for (let i = 0; i < 25; i++) {
      if (await repo.driver.lock(name, repo.tabId, 8000)) return fn();
      await sleep(250 + Math.random() * 300);
    }
    throw new Error('Numaralandırma kilidi alınamadı. Lütfen tekrar deneyin.');
  }

  // ----- geçmiş -----
  async function addHistory(aksiyonId, tip, surum, degisiklikler, extra) {
    const id = aksiyonId + '__' + String(surum).padStart(4, '0') + '__' + rid();
    const h = Object.assign({ aksiyonId, tip, surum, zaman: new Date().toISOString(), kullaniciId: repo.me ? repo.me.id : null, kullaniciAd: repo.me && repo.driver.storeNames ? (repo.me.name || '') : '', kullaniciEtiket: repo.me ? '' : (repo.driver.mode === 'cloud' ? 'Kimliği belirlenemeyen kullanıcı' : 'Yerel test kullanıcısı'), degisiklikler: degisiklikler || [] }, extra || {});
    await repo.driver.set('history', id, h);
  }
  repo.history = async function (aksiyonId) {
    const list = await repo.driver.query('history', 'aksiyonId', aksiyonId);
    return list.sort((a, b) => (b.zaman || '').localeCompare(a.zaman || ''));
  };

  // ----- oluşturma -----
  const EDITABLE = ['isNo', 'firma', 'hat', 'konu', 'alinacakAksiyon', 'aksiyonAcan', 'talepTarihi', 'talepEden', 'sorumluDepartman', 'sorumluPersonel', 'onay', 'terminTarihi', 'tamamlanmaTarihi', 'durum', 'oncelik', 'kapanisAciklamasi'];

  function buildAction(form, id, isNo) {
    const m = M(), now = new Date().toISOString();
    const a = { aksiyonId: id };
    for (const k of EDITABLE) a[k] = form[k] == null ? '' : form[k];
    a.isNo = isNo;
    a.durum = a.durum || 'Açık';
    a.oncelik = a.oncelik || 'Normal';
    a.talepTarihi = a.talepTarihi || m.todayStr();
    if (a.durum === 'Tamamlandı' && !a.tamamlanmaTarihi) a.tamamlanmaTarihi = m.todayStr();
    if (repo.me && form.aksiyonAcanOtomatik) { a.aksiyonAcanId = repo.me.id; a.aksiyonAcan = repo.driver.storeNames ? (repo.me.name || '') : ''; }
    a.olusturmaTarihi = now; a.sonGuncelleme = now; a.surum = 1;
    a.olusturanId = repo.me ? repo.me.id : null;
    a.excel = { sonBasariliSurum: null, sonBasariliTarih: null, sonAktarimVerisi: null, bekleyenBatch: null, bekleyenSurum: null };
    return a;
  }
  // Sürücü karşılaştır-ve-yaz destekliyorsa (M365/ETag) numara kilitsiz ve çakışmasız ayrılır
  async function reserveNumbers(form) {
    const m = M(), manual = !(form.isNo === '' || form.isNo == null);
    let seq, isNo;
    const nn = await repo.driver.casUpdate('config', 'numbering', cur => {
      cur = cur || repo.numbering || { idPrefix: 'TA-', nextSeq: 1, nextIsNo: 1 };
      let maxSeen = 0, maxIsNo = 0;
      for (const a of repo.actions.values()) { const n = m.parseIdNum(a.aksiyonId, cur.idPrefix); if (n && n > maxSeen) maxSeen = n; if (typeof a.isNo === 'number' && a.isNo > maxIsNo) maxIsNo = a.isNo; }
      seq = Math.max(cur.nextSeq || 1, maxSeen + 1);
      isNo = manual ? Number(form.isNo) : (cur.nextIsNo || (maxIsNo + 1));
      return Object.assign({}, cur, { nextSeq: seq + 1, nextIsNo: manual ? cur.nextIsNo : isNo + 1 });
    });
    repo.numbering = nn;
    return { id: m.formatId(nn.idPrefix, seq), isNo };
  }

  repo.createAction = async function (form) {
    const m = M();
    if (!form.konu || !String(form.konu).trim()) throw new Error('Konu zorunludur.');
    if (repo.driver.casUpdate) {
      for (let attempt = 0; attempt < 6; attempt++) {
        const { id, isNo } = await reserveNumbers(form);
        const a = buildAction(form, id, isNo);
        try { await repo.driver.set('actions', id, a); }
        catch (e) { if (e.status === 409) continue; throw e; } // aynı Aksiyon ID zaten varsa yeni numara al
        await addHistory(id, 'olusturma', 1, []);
        repo.actions.set(id, a); repo.emit('actions');
        return a;
      }
      throw new Error('Benzersiz Aksiyon ID alınamadı. Numaralandırma ayarlarını kontrol edin.');
    }
    return withLock('idgen', async () => {
      const num = (await repo.driver.get('config', 'numbering')) || repo.numbering;
      const prefix = num.idPrefix;
      let maxSeen = 0, maxIsNo = 0;
      for (const a of repo.actions.values()) {
        const n = m.parseIdNum(a.aksiyonId, prefix); if (n && n > maxSeen) maxSeen = n;
        if (typeof a.isNo === 'number' && a.isNo > maxIsNo) maxIsNo = a.isNo;
      }
      let seq = Math.max(num.nextSeq || 1, maxSeen + 1), id;
      for (;;) { id = m.formatId(prefix, seq); if (!(await repo.driver.get('actions', id))) break; seq++; }
      const autoIsNo = num.nextIsNo || (maxIsNo + 1); // İş No Excel'de dönemsel yeniden başlıyor; ayardaki sıradaki değer esas
      const isNo = (form.isNo === '' || form.isNo == null) ? autoIsNo : Number(form.isNo);
      const now = new Date().toISOString();
      const a = { aksiyonId: id };
      for (const k of EDITABLE) a[k] = form[k] == null ? '' : form[k];
      a.isNo = isNo;
      a.durum = a.durum || 'Açık';
      a.oncelik = a.oncelik || 'Normal';
      a.talepTarihi = a.talepTarihi || m.todayStr();
      if (a.durum === 'Tamamlandı' && !a.tamamlanmaTarihi) a.tamamlanmaTarihi = m.todayStr();
      if (repo.me && form.aksiyonAcanOtomatik) { a.aksiyonAcanId = repo.me.id; a.aksiyonAcan = ''; }
      a.olusturmaTarihi = now; a.sonGuncelleme = now; a.surum = 1;
      a.olusturanId = repo.me ? repo.me.id : null;
      a.excel = { sonBasariliSurum: null, sonBasariliTarih: null, sonAktarimVerisi: null, bekleyenBatch: null, bekleyenSurum: null };
      await repo.driver.set('actions', id, a);
      const newNum = Object.assign({}, num, { nextSeq: seq + 1, nextIsNo: (form.isNo === '' || form.isNo == null) ? autoIsNo + 1 : num.nextIsNo });
      await repo.driver.set('config', 'numbering', newNum); repo.numbering = newNum;
      await addHistory(id, 'olusturma', 1, []);
      repo.actions.set(id, a); repo.emit('actions');
      return a;
    });
  };

  // ----- güncelleme -----
  function ConflictError(current) { const e = new Error('Bu kayıt siz düzenlerken başka biri tarafından değiştirildi (sürüm ' + current.surum + ').'); e.conflict = true; e.current = current; return e; }

  repo.updateAction = async function (id, patch, baseSurum) {
    const m = M();
    const cur = await repo.driver.get('actions', id);
    if (!cur) throw new Error('Kayıt bulunamadı: ' + id);
    if (baseSurum != null && cur.surum !== baseSurum) throw ConflictError(cur);
    const next = clone(cur);
    for (const k of EDITABLE) if (k in patch) next[k] = patch[k] == null ? '' : patch[k];
    if ('isNo' in patch && patch.isNo !== '') next.isNo = Number(patch.isNo);
    // Kural: Tamamlandı'ya geçişte tamamlanma tarihi otomatik; geri açılınca temizlenir
    let tip = 'guncelleme';
    if (next.durum === 'Tamamlandı' && cur.durum !== 'Tamamlandı') { if (!next.tamamlanmaTarihi) next.tamamlanmaTarihi = m.todayStr(); tip = 'tamamlama'; }
    if (next.durum !== 'Tamamlandı' && cur.durum === 'Tamamlandı') { next.tamamlanmaTarihi = ''; tip = 'yeniden_acma'; }
    const changes = [];
    for (const k of EDITABLE) if (String(cur[k] ?? '') !== String(next[k] ?? '')) changes.push({ alan: k, eski: cur[k] ?? '', yeni: next[k] ?? '' });
    if (!changes.length) return cur;
    next.surum = (cur.surum || 1) + 1;
    next.sonGuncelleme = new Date().toISOString();
    next.guncelleyenId = repo.me ? repo.me.id : null;
    await repo.driver.set('actions', id, next);
    await addHistory(id, tip, next.surum, changes);
    repo.actions.set(id, next); repo.emit('actions');
    return next;
  };

  repo.completeAction = (id, baseSurum, not) => repo.updateAction(id, Object.assign({ durum: 'Tamamlandı' }, not ? { kapanisAciklamasi: not } : {}), baseSurum);

  // ----- silme (yumuşak) ve geri alma -----
  async function setDeleted(id, flag, baseSurum, neden) {
    const cur = await repo.driver.get('actions', id);
    if (!cur) throw new Error('Kayıt bulunamadı: ' + id);
    if (baseSurum != null && cur.surum !== baseSurum) throw ConflictError(cur);
    if (!!cur.silindi === flag) return cur;
    const next = clone(cur), now = new Date().toISOString();
    if (flag) { next.silindi = true; next.silinmeZamani = now; next.silenId = repo.me ? repo.me.id : null; next.silenAd = repo.me && repo.driver.storeNames ? (repo.me.name || '') : ''; next.silmeNedeni = neden || ''; }
    else { delete next.silindi; delete next.silinmeZamani; delete next.silenId; delete next.silenAd; delete next.silmeNedeni; }
    next.surum = (cur.surum || 1) + 1; next.sonGuncelleme = now; next.guncelleyenId = repo.me ? repo.me.id : null;
    await repo.driver.set('actions', id, next);
    await addHistory(id, flag ? 'silme' : 'geri_alma', next.surum, [], neden ? { neden } : null);
    repo.actions.set(id, next); repo.emit('actions');
    return next;
  }
  repo.deleteAction = (id, baseSurum, neden) => setDeleted(id, true, baseSurum, neden);
  repo.restoreAction = (id) => setDeleted(id, false, null);

  // ----- yinelenen kayıt koruması -----
  // Aynı konu + firma + hat ile son 10 dakikada açılmış, silinmemiş kayıt varsa döndürür.
  repo.findRecentDuplicate = function (o, minutes) {
    const norm = (x) => String(x || '').toLocaleLowerCase('tr').replace(/\s+/g, ' ').trim();
    const lim = Date.now() - (minutes || 10) * 60000;
    return repo.allActions().find(a => norm(a.konu) === norm(o.konu) && norm(a.firma) === norm(o.firma) && norm(a.hat) === norm(o.hat) && a.olusturmaTarihi && Date.parse(a.olusturmaTarihi) >= lim) || null;
  };

  // Excel meta verisi — kayıt sürümünü ARTIRMAZ
  async function setExcelMeta(id, patch) {
    const cur = await repo.driver.get('actions', id); if (!cur) return null;
    cur.excel = Object.assign({}, cur.excel || {}, patch);
    await repo.driver.set('actions', id, cur); repo.actions.set(id, cur);
    return cur;
  }

  // ----- listeler -----
  repo.saveLists = async function (lists) { repo.lists = lists; await repo.driver.set('config', 'lists', lists); repo.emit('lists'); };
  repo.addListValue = async function (key, value) {
    value = String(value); if (!value.trim()) return;
    const l = clone(repo.lists || {}); l[key] = l[key] || [];
    if (!l[key].includes(value)) { l[key].push(value); await repo.saveLists(l); }
  };
  repo.removeListValue = async function (key, value) {
    const l = clone(repo.lists || {}); l[key] = (l[key] || []).filter(v => v !== value); await repo.saveLists(l);
  };
  repo.saveNumbering = async function (n) { repo.numbering = n; await repo.driver.set('config', 'numbering', n); repo.emit('numbering'); };

  // ----- Excel aktarım partileri -----
  repo.createBatch = async function (items, adapterId) {
    const id = 'EXP-' + new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14) + '-' + rid().slice(0, 4);
    const batch = { id, olusturma: new Date().toISOString(), olusturanId: repo.me ? repo.me.id : null, adaptor: adapterId, durum: 'hazirlandi', items, dogrulama: null, indirme: null };
    await repo.driver.set('exports', id, batch);
    for (const it of items) {
      await setExcelMeta(it.aksiyonId, { bekleyenBatch: id, bekleyenSurum: it.surum });
      await addHistory(it.aksiyonId, 'excel_hazirlama', it.surum, [], { batch: id });
    }
    repo.emit('actions');
    return batch;
  };
  repo.updateBatch = async function (id, patch) {
    const b = await repo.driver.get('exports', id); if (!b) return null;
    const n = Object.assign(b, patch); await repo.driver.set('exports', id, n); return n;
  };
  repo.cancelBatch = async function (id) {
    const b = await repo.driver.get('exports', id); if (!b) return;
    for (const it of b.items) {
      const a = await repo.driver.get('actions', it.aksiyonId);
      if (a && a.excel && a.excel.bekleyenBatch === id) await setExcelMeta(it.aksiyonId, { bekleyenBatch: null, bekleyenSurum: null });
    }
    await repo.updateBatch(id, { durum: 'iptal' }); repo.emit('actions');
  };
  // Doğrulama sonucu: yalnızca hedef Excel'de birebir eşleşen kayıtlar "aktarıldı" sayılır
  repo.applyVerification = async function (batchId, results, fileName) {
    const b = await repo.driver.get('exports', batchId); if (!b) throw new Error('Parti bulunamadı');
    let ok = 0;
    for (const r of results) {
      const it = b.items.find(x => x.aksiyonId === r.aksiyonId); if (!it) continue;
      const a = await repo.driver.get('actions', r.aksiyonId);
      if (r.ok) {
        ok++;
        if (a && a.excel && a.excel.bekleyenBatch === batchId) {
          await setExcelMeta(r.aksiyonId, { sonBasariliSurum: it.surum, sonBasariliTarih: new Date().toISOString(), sonAktarimVerisi: it.kayit, bekleyenBatch: null, bekleyenSurum: null });
          await addHistory(r.aksiyonId, 'excel_dogrulama', it.surum, [], { batch: batchId, sonuc: 'basarili' });
        }
      }
    }
    const durum = ok === b.items.length ? 'dogrulandi' : (ok > 0 ? 'kismi' : 'dogrulanamadi');
    const dogrulama = { zaman: new Date().toISOString(), dosya: fileName, basarili: ok, toplam: b.items.length, sonuclar: results, kullaniciId: repo.me ? repo.me.id : null };
    const n = await repo.updateBatch(batchId, { durum, dogrulama });
    repo.emit('actions');
    return n;
  };

  // ----- sentetik test verisi -----
  repo.seedSynthetic = async function (count, onProgress) {
    const m = M();
    const L = repo.lists || TAP.SEED_LISTS;
    const pick = (arr, i) => arr[i % arr.length];
    const firmalar = ['Z1', 'Z2', 'Z3'].filter(v => (L.firma || []).includes(v));
    const hatlar = ['Hat 1', 'Hat 2', 'Hat 3', 'Hat 4', 'Genel', 'Depo'].filter(v => (L.hat || []).includes(v));
    const depts = ['Teknik', 'Otomasyon', 'Proses Geliştirme'].filter(v => (L.sorumluDepartman || []).includes(v));
    const talep = ['Üretim', 'Kalite', 'İdari işler'].filter(v => (L.talepEden || []).includes(v));
    const kisiler = ['TEST Personel A', 'TEST Personel B', 'TEST Personel C', 'TEST Personel D'];
    const konular = ['[TEST] Konveyör bandı kayıyor', '[TEST] Paketleme çenesi ısı sorunu', '[TEST] Kompresör basınç düşüşü', '[TEST] Fırın sıcaklık sensörü arızası', '[TEST] Dolum nozulu damlatıyor', '[TEST] Xray reject kolu yavaş', '[TEST] Soğutma tüneli fan titreşimi', '[TEST] Tartım hücresi kalibrasyonu', '[TEST] Mikser rulman sesi', '[TEST] Pnömatik hortum kaçağı'];
    const aksiyonlar = ['Rulman değişecek', 'Kalibrasyon yapılacak', 'Yedek parça siparişi verilecek', 'Bakım planına eklenecek', 'Kablo bağlantıları kontrol edilecek', ''];
    const today = m.todayStr();
    for (let i = 0; i < count; i++) {
      const talepT = m.addDays(today, -((i * 3) % 40) - 1);
      const termOff = [-10, -3, 2, 5, 12, 25, null, -1, 6, null][i % 10];
      const durum = i % 4 === 0 ? 'Tamamlandı' : (i % 4 === 1 ? 'Devam Ediyor' : 'Açık');
      await repo.createAction({
        firma: pick(firmalar, i), hat: pick(hatlar, i * 7), konu: pick(konular, i) + ' #' + (i + 1), alinacakAksiyon: pick(aksiyonlar, i),
        aksiyonAcan: 'TEST Kullanıcı', talepTarihi: talepT, talepEden: pick(talep, i), sorumluDepartman: pick(depts, i), sorumluPersonel: pick(kisiler, i),
        onay: '', terminTarihi: termOff == null ? '' : m.addDays(today, termOff), durum, tamamlanmaTarihi: durum === 'Tamamlandı' ? m.addDays(talepT, 2 + (i % 5)) : '',
        oncelik: ['Normal', 'Yüksek', 'Kritik', 'Düşük', 'Normal'][i % 5],
      });
      if (onProgress) onProgress(i + 1, count);
    }
  };

  // ----- M365: kurulum ve Excel'den içe aktarma -----
  repo.provision = async function (onProgress) { return repo.driver.provision(onProgress); };
  repo.saveAdmins = async function (emails) {
    const list = [...new Set(emails.map(e => String(e).trim().toLowerCase()).filter(Boolean))];
    await repo.driver.set('config', 'yoneticiler', { emails: list });
    repo.admins = list; if (repo.me) repo.me.canEdit = repo.me.isOwner = list.includes(repo.me.email);
    repo.emit('admins');
  };
  repo.importExcel = async function (parsed, onProgress) {
    const docs = parsed.recs.map(a => ({ _id: a.aksiyonId, doc: a }));
    const res = repo.driver.batchCreate ? await repo.driver.batchCreate('actions', docs, onProgress)
      : await (async () => { let created = 0, skipped = 0; for (let i = 0; i < docs.length; i++) { if (await repo.driver.get('actions', docs[i]._id)) skipped++; else { await repo.driver.set('actions', docs[i]._id, docs[i].doc); created++; } onProgress && onProgress(i + 1, docs.length); } return { created, skipped, failed: [] }; })();
    // numaralandırma: mevcut değerden geri gitmez
    const pn = parsed.numbering;
    const upd = cur => { cur = cur || {}; return { idPrefix: pn.idPrefix, nextSeq: Math.max(cur.idPrefix === pn.idPrefix ? (cur.nextSeq || 1) : 1, pn.nextSeq), nextIsNo: cur.idPrefix === pn.idPrefix && cur.nextIsNo ? Math.max(cur.nextIsNo, pn.nextIsNo) : pn.nextIsNo }; };
    if (repo.driver.casUpdate) repo.numbering = await repo.driver.casUpdate('config', 'numbering', upd);
    else { repo.numbering = upd(await repo.driver.get('config', 'numbering')); await repo.driver.set('config', 'numbering', repo.numbering); }
    // seçim listeleri: mevcut değerler korunur, Excel'deki yeni değerler eklenir (birleştirme yok)
    const cur = (await repo.driver.get('config', 'lists')) || {};
    const merged = {}; for (const k of M().LIST_KEYS) { merged[k] = (cur[k] || []).slice(); for (const v of (parsed.lists[k] || [])) if (!merged[k].includes(v)) merged[k].push(v); }
    await repo.saveLists(merged);
    const logId = 'excel-' + new Date().toISOString().replace(/[-:T.Z]/g, '').slice(0, 14);
    await repo.driver.set('imports', logId, { dosya: parsed.fileName, zaman: new Date().toISOString(), kullaniciId: repo.me ? repo.me.id : null, kullaniciAd: repo.me ? repo.me.name : '', kayitSayisi: parsed.recs.length, olusturulan: res.created, atlanan: res.skipped, hatali: res.failed, uyarilar: parsed.warns });
    if (!(repo.admins && repo.admins.length) && repo.me && repo.me.email) await repo.saveAdmins([repo.me.email]);
    return res;
  };

  repo.isWritable = async function () {
    if (repo.dbUnavailable) return false;
    if (repo.driver.mode === 'm365') return true; // yetkiyi SharePoint uygular; reddedilen yazma hata olarak gösterilir
    if (repo.driver.mode !== 'cloud' || !repo.userApi) return true;
    try { const c = await repo.userApi.can('data.write'); return c !== false; } catch (e) { return true; }
  };

  TAP.repo = repo;
  TAP.storageInternals = { DbDriver, LocalDriver, LS_PREFIX, deepMerge };
})(window.TAP);

/* Microsoft 365 sürücüsü — veriler şirketin SharePoint sitesindeki listelerde, Microsoft Graph ile
 *
 * Listeler (kurulum sihirbazı oluşturur):
 *   TAP_Aksiyonlar        aksiyon kayıtları — Excel alanları ayrı sütunlar, ek bilgiler Meta (JSON)
 *   TAP_Gecmis            değişiklik geçmişi (her işlem bir satır)
 *   TAP_AktarimPartileri  Excel aktarım partileri
 *   TAP_Numaralandirma    sıradaki Aksiyon ID / İş No (tüm kullanıcılar yazar; ETag ile çakışmasız)
 *   TAP_Ayarlar           seçim listeleri, panel yöneticileri (yalnızca yöneticiler yazmalı)
 *   TAP_IceAktarmalar     Excel içe aktarma kayıtları
 * Gerçek zamanlı akış yoktur: liste değişim zamanı ~20 sn'de bir yoklanır, değiştiyse yeniden okunur.

window.TAP = window.TAP || {};
(function (TAP) {

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  // [panel anahtarı, SharePoint iç ad, görünen ad (Excel ile aynı), tür]

    ['aksiyonId', 'AksiyonID', 'Aksiyon ID', 'id'],
    ['isNo', 'IsNo', 'İş No', 'number'],
    ['firma', 'Firma', 'Firma', 'text'],
    ['hat', 'Hat', 'Hat', 'text'],
    ['konu', 'Konu', 'Konu', 'note'],
    ['alinacakAksiyon', 'AlinacakAksiyon', 'Alınacak Aksiyon', 'note'],
    ['aksiyonAcan', 'AksiyonAcan', 'Aksiyon Açan', 'text'],
    ['talepTarihi', 'TalepTarihi', 'Talep Tarihi', 'text'],
    ['talepEden', 'TalepEden', 'Talep Eden', 'text'],
    ['sorumluDepartman', 'SorumluDepartman', 'Sorumlu Departman', 'text'],
    ['sorumluPersonel', 'SorumluPersonel', 'Sorumlu Personel', 'text'],
    ['onay', 'Onay', 'Onay', 'text'],
    ['terminTarihi', 'TerminTarihi', 'Termin Tarihi', 'text'],
    ['tamamlanmaTarihi', 'TamamlanmaTarihi', 'Tamamlanma Tarihi', 'text'],
    ['durum', 'Durum', 'Durum', 'text'],
    ['oncelik', 'Oncelik', 'Öncelik', 'text'],

    numbering: [colDef('Veri', 'Veri', 'note')],

  };

/* Microsoft 365 (Entra ID) girişi — MSAL.js 3 (tarayıcı, PKCE, istemci sırrı yok)
 * Yapılandırma: ayarlar.js -> window.TAP_CONFIG = { mode:'m365', tenantId, clientId, siteUrl, redirectUri? }
 * Testlerde window.__TAP_AUTH_MOCK = { account:{name, username, localAccountId}, token:'...' } ile atlanır.
 */
window.TAP = window.TAP || {};
(function (TAP) {
  'use strict';
  const BASE_SCOPES = ['User.Read', 'Sites.ReadWrite.All'];
  const SETUP_SCOPES = ['Sites.Manage.All'];
  let pca = null, account = null, cfg = null;

  function mock() { return window.__TAP_AUTH_MOCK || null; }

  const auth = {
    scopes: BASE_SCOPES, setupScopes: SETUP_SCOPES,
    get account() { return account; },
    async init(c) {
      cfg = c;
      if (mock()) { account = mock().account; return account; }
      if (!window.msal) throw new Error('Giriş kütüphanesi (MSAL) yüklenemedi.');
      if (!cfg.clientId || !cfg.tenantId) throw new Error('ayarlar.js içinde tenantId ve clientId tanımlı değil. BT kurulum kılavuzuna bakın.');
      pca = new msal.PublicClientApplication({
        auth: { clientId: cfg.clientId, authority: 'https://login.microsoftonline.com/' + cfg.tenantId, redirectUri: cfg.redirectUri || (location.origin + location.pathname), navigateToLoginRequestUrl: true },
        cache: { cacheLocation: 'localStorage' }, // girişin telefonda da hatırlanması için; yalnızca kimlik belirteçleri
      });
      await pca.initialize();
      const res = await pca.handleRedirectPromise();
      if (res && res.account) account = res.account;
      if (!account) { const all = pca.getAllAccounts(); if (all.length) account = all[0]; }
      if (account) pca.setActiveAccount(account);
      return account;
    },
    login() {
      if (mock()) return;
      return pca.loginRedirect({ scopes: BASE_SCOPES, prompt: 'select_account' });
    },
    logout() {
      if (mock()) { location.reload(); return; }
      return pca.logoutRedirect({ account, postLogoutRedirectUri: cfg.redirectUri || (location.origin + location.pathname) });
    },
    async token(extraScopes) {
      if (mock()) return mock().token || 'test-token';
      const scopes = extraScopes ? BASE_SCOPES.concat(extraScopes) : BASE_SCOPES;
      try {
        const r = await pca.acquireTokenSilent({ scopes, account });
        return r.accessToken;
      } catch (e) {
        if (e instanceof msal.InteractionRequiredAuthError || /interaction_required|consent_required|login_required/.test(e.errorCode || '')) {
          await pca.acquireTokenRedirect({ scopes, account });
          return new Promise(() => {}); // yönlendirme sürerken bekler
        }
        throw e;
      }
    },
    me() {
      if (!account) return null;
      return { id: account.localAccountId || account.homeAccountId, name: account.name || account.username, email: (account.username || '').toLowerCase() };
    },
  };
  TAP.auth = auth;
})(window.TAP);

/* Excel içe aktarıcı — "Teknik Aksiyon Listesi.xlsx" dosyasını tarayıcıda okur (dosya hiçbir yere yüklenmez)
 * tools/excel_to_panel.py ile aynı kurallar:
 *  - Excel'den gelen kayıtlar Excel'de zaten bulunduğu için "Aktarıldı (sürüm 1)" işaretlenir
 *  - Durum '✔' -> Tamamlandı, boş -> Açık

  const K = ['isNo', 'firma', 'hat', 'konu', 'alinacakAksiyon', 'aksiyonAcan', 'talepTarihi', 'talepEden', 'sorumluDepartman', 'sorumluPersonel', 'onay', 'terminTarihi', 'tamamlanmaTarihi', 'durum', 'aksiyonId'];

  const LIST_SRC = { firma: 'Firma', hat: 'Hat', talepEden: 'Talep Eden', sorumluDepartman: 'Sorumlu Departman', sorumluPersonel: 'Sorumlu Personel' };

  const FILTERS = [
    { k: 'durum', label: 'Durum', opts: () => m.DURUMLAR },

    { k: 'hat', label: 'Hat', opts: () => uniq('hat') },

  ];
  function uniq(k) { const s = new Set(); for (const a of repo.allActions()) if (a[k] != null && a[k] !== '') s.add(String(a[k])); return [...s].sort((a, b) => a.localeCompare(b, 'tr')); }
  const ONC_RANK = { 'Kritik': 0, 'Yüksek': 1, 'Normal': 2, 'Düşük': 3 };
  function filterActions(view) {
    const st = ui.lists[view], today = m.todayStr(), q = trl(st.q.trim());
    let arr = repo.allActions();
    if (view === 'acik') arr = arr.filter(a => !m.isDone(a));
    if (view === 'tamamlanan') arr = arr.filter(m.isDone);
    for (const [k, v] of Object.entries(st.f)) {
      if (!v) continue;
      if (k === 'termin') arr = arr.filter(a => m.terminState(a, today) === v);
      else if (k === 'hafta') arr = arr.filter(a => v === 'acilan' ? m.inWeek(a.talepTarihi, today) : (m.isDone(a) && m.inWeek(a.tamamlanmaTarihi, today)));
      else if (k === 'terminFrom') arr = arr.filter(a => a.terminTarihi && a.terminTarihi >= v);
      else if (k === 'terminTo') arr = arr.filter(a => a.terminTarihi && a.terminTarihi <= v);
      else if (k === 'excel') arr = arr.filter(a => m.excelState(a) === v);
      else arr = arr.filter(a => String(a[k] ?? '') === v);
    }
    if (q) arr = arr.filter(a => trl([a.aksiyonId, a.isNo, a.konu, a.alinacakAksiyon, a.firma, a.hat, a.talepEden, a.sorumluDepartman, a.sorumluPersonel, repo.acanName(a)].join(' ')).includes(q));
    const { k, d } = st.sort, dir = d === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      let x = a[k], y = b[k];

      if (k === 'isNo') { x = Number(x) || 0; y = Number(y) || 0; }
      const ex = x == null || x === '', ey = y == null || y === '';
      if (ex && ey) return 0; if (ex) return 1; if (ey) return -1; // boşlar hep sonda
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'tr', { numeric: true })) * dir;
    });
    return arr;
  }
  const COLS = [['aksiyonId', 'Aksiyon ID'], ['isNo', 'İş No'], ['konu', 'Konu / Aksiyon'], ['firma', 'Firma'], ['hat', 'Hat'], ['sorumluDepartman', 'Sorumlu'], ['talepTarihi', 'Talep T.'], ['terminTarihi', 'Termin'], ['durum', 'Durum'], ['oncelik', 'Öncelik']];

  function monthlyChart(arr) {

    const closed = months.map(mo => arr.filter(a => m.isDone(a) && (a.tamamlanmaTarihi || '').startsWith(mo)).length);
    const max = Math.max(1, ...opened, ...closed), W = 600, H = 200, pad = 28, bw = 26, gw = (W - pad * 2) / months.length;
    const AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
    let s = '<svg viewBox="0 0 ' + W + ' ' + (H + 30) + '" role="img" aria-label="Aylık açılan ve kapanan aksiyonlar">';
    for (let i = 0; i <= 4; i++) { const y = pad + (H - pad) * i / 4; s += '<line x1="' + pad + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/>'; }
    months.forEach((mo, i) => {
      const x = pad + gw * i + gw / 2, h1 = (H - pad) * opened[i] / max, h2 = (H - pad) * closed[i] / max;
      s += '<rect x="' + (x - bw - 2) + '" y="' + (H - h1) + '" width="' + bw + '" height="' + h1 + '" rx="4" fill="var(--info)"><title>' + opened[i] + ' açılan</title></rect>';

      if (opened[i]) s += '<text x="' + (x - bw / 2 - 2) + '" y="' + (H - h1 - 5) + '" text-anchor="middle">' + opened[i] + '</text>';

  async function downloadBatch(id) {

      toast('Aktarım dosyası indirildi. Hedef Excel\'e işledikten sonra doğrulayın.', 'ok');

  }
  async function verifyBatch(id, file) {
    const bt = await repo.driver.get('exports', id); if (!bt) return;
    try {
      const buf = await file.arrayBuffer();
      const res = await TAP.excel.adapters[bt.adaptor || 'manual-file'].verify(bt, buf);
      const n = await repo.applyVerification(id, res, file.name);
      const ok = res.filter(r => r.ok).length;
      toast(ok + '/' + res.length + ' kayıt hedef Excel\'de doğrulandı.', ok === res.length ? 'ok' : 'bad');

      const res = await repo.importExcel(parsed, (i, n) => { btn.textContent = i + '/' + n + ' aktarılıyor…'; });
      closeModal(); ui.pendingImport = null;
      toast(res.created + ' kayıt aktarıldı' + (res.skipped ? ', ' + res.skipped + ' zaten vardı' : '') + (res.failed.length ? ', ' + res.failed.length + ' HATALI' : '') + '.', res.failed.length ? 'bad' : 'ok');

  // Görünümler yalın #anahtar ile adlandırılır (Artifact görüntüleyicisi yalnızca düz #çapa iletir)
  function go(r) { try { history.replaceState(null, '', '#' + r); } catch (e) { /* çerçeve izin vermeyebilir */ } goRoute(r); }
  function goRoute(forced) {
    const r = (typeof forced === 'string' && forced) || (location.hash.match(/^#\/?(\w+)/) || [])[1] || 'dashboard';
    ui.route = ROUTES.some(x => x.id === r) ? r : 'dashboard';

    openModal('<div class="modal-h"><h2>Menü</h2></div><div class="modal-b menu-sheet"><nav class="nav">' + ROUTES.map(r => '<a href="#' + r.id + '" data-route="' + r.id + '" class="' + (ui.route === r.id ? 'on' : '') + '">' + ic(r.icon) + '<span>' + r.label + '</span></a>').join('') + '</nav></div><div class="modal-f"><button class="btn" data-mclose>Kapat</button></div>');
